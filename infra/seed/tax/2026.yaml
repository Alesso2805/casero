# Configuración tributaria de 2026. Única fuente de estos valores (CLAUDE.md, regla 6).
# Se carga en la migración 0006 y en cada arranque del migrador (docs/ops/tax-config.md).
# Pendiente: validación del contador antes de la beta.
year: 2026

rules:
  # LIR art. 84, modificado por la Ley N.° 32541 (vigente desde el 1.1.2026): 6.25 % sobre
  # la renta bruta percibida menos el 20 %. Otras fuentes de esta sección:
  # - UIT: D.S. N.° 301-2025-EF, https://busquedas.elperuano.pe/dispositivo/NL/2469116-1
  # - Bancarización desde S/ 2,000: TUO de la Ley N.° 28194, art. 4 (D.Leg. N.° 1529),
  #   https://busquedas.elperuano.pe/dispositivo/NL/2044433-2
  # - Renta mínima del 6 % del autovalúo: LIR art. 23 a),
  #   https://www.sunat.gob.pe/legislacion/renta/ley/capv.pdf
  # - Redondeo a soles enteros, mitad hacia arriba: R.S. N.° 025-2000/SUNAT, art. 2,
  #   https://www.sunat.gob.pe/legislacion/superin/2000/025.htm. Casero redondea la base y
  #   el tributo (SPEC); pendiente de confirmar con el contador.
  source_url: https://www.sunat.gob.pe/legislacion/renta/ley/capxi.pdf
  rate_bp: 625
  deduction_bp: 2000
  rounding: half_up_sol
  cash_threshold_cents: 200000
  min_rent_bp: 600
  uit_cents: 550000

