name: casero

x-mail: &mail
  CASERO_SMTP_HOST: ${CASERO_SMTP_HOST:?}
  CASERO_SMTP_PORT: ${CASERO_SMTP_PORT:-587}
  CASERO_SMTP_SECURITY: ${CASERO_SMTP_SECURITY:-starttls}
  CASERO_SMTP_USERNAME: ${CASERO_SMTP_USERNAME:?}
  CASERO_SMTP_PASSWORD: ${CASERO_SMTP_PASSWORD:?}
  CASERO_MAIL_FROM: ${CASERO_MAIL_FROM:?}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ${CASERO_BACKEND_IMAGE:-ghcr.io/alesso2805/casero-backend}:${IMAGE_TAG:?}
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      # Error details quote the offending values, personal data included (rule 8).
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: casero
      CASERO_OWNER_PASSWORD: ${CASERO_OWNER_PASSWORD:?}
      CASERO_BACKUP_PASSWORD: ${CASERO_BACKUP_PASSWORD:?}
      CASERO_APP_PASSWORD: ${CASERO_APP_PASSWORD:?}
      CASERO_WORKER_PASSWORD: ${CASERO_WORKER_PASSWORD:?}
      CASERO_ADMIN_PASSWORD: ${CASERO_ADMIN_PASSWORD:?}
    volumes:
      - ${CASERO_POSTGRES_INIT:-./postgres-init}:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname casero --host 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging: *logging

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m casero.tax.infrastructure.tax_config"]
    environment:
      CASERO_MIGRATION_DATABASE_URL: postgresql+asyncpg://casero_owner:${CASERO_OWNER_PASSWORD:?}@postgres:5432/casero
      CASERO_ADMIN_DATABASE_URL: postgresql+asyncpg://casero_admin:${CASERO_ADMIN_PASSWORD:?}@postgres:5432/casero
      CASERO_PUBLIC_URL: https://${CASERO_DOMAIN:?}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "--factory", "casero.api:create_app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    environment:
      CASERO_APP_DATABASE_URL: postgresql+asyncpg://casero_app:${CASERO_APP_PASSWORD:?}@postgres:5432/casero
      CASERO_RATE_LIMIT_KEY: ${CASERO_RATE_LIMIT_KEY:?}
      CASERO_EMAIL_HASH_KEY: ${CASERO_EMAIL_HASH_KEY:?}
      CASERO_SES_EVENTS_TOPIC_ARN: ${CASERO_SES_EVENTS_TOPIC_ARN:?}
      CASERO_UNSUBSCRIBE_KEY: ${CASERO_UNSUBSCRIBE_KEY:?}
      CASERO_ACCEPTANCE_IP_KEY: ${CASERO_ACCEPTANCE_IP_KEY:?}
      CASERO_ENCRYPTION_KEYS: ${CASERO_ENCRYPTION_KEYS:?}
      CASERO_ENCRYPTION_ACTIVE_KEY: ${CASERO_ENCRYPTION_ACTIVE_KEY:?}
      CASERO_DOC_HMAC_KEY: ${CASERO_DOC_HMAC_KEY:?}
      SENTRY_DSN: ${SENTRY_DSN:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      CASERO_PUBLIC_URL: https://${CASERO_DOMAIN:?}
      <<: *mail
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "casero.worker"]
    environment:
      CASERO_WORKER_DATABASE_URL: postgresql://casero_worker:${CASERO_WORKER_PASSWORD:?}@postgres:5432/casero
      CASERO_EMAIL_HASH_KEY: ${CASERO_EMAIL_HASH_KEY:?}
      <<: *mail
      CASERO_BUSINESS_NAME: ${CASERO_BUSINESS_NAME:?}
      CASERO_BUSINESS_RUC: ${CASERO_BUSINESS_RUC:?}
      CASERO_BUSINESS_ADDRESS: ${CASERO_BUSINESS_ADDRESS:?}
      CASERO_COMPLAINTS_INBOX: ${CASERO_COMPLAINTS_INBOX:?}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CASERO_ALERTS_INBOX: ${CASERO_ALERTS_INBOX:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Off until the owner sets COMPOSE_PROFILES=backup and the variables in docs/ops/backups.md.
  backup:
    image: ${CASERO_BACKUP_IMAGE:-ghcr.io/alesso2805/casero-backup}:${IMAGE_TAG:?}
    profiles: ["backup"]
    restart: unless-stopped
    logging: *logging
    environment:
      CASERO_BACKUP_PASSWORD: ${CASERO_BACKUP_PASSWORD:?}
      CASERO_BACKUP_AGE_RECIPIENT: ${CASERO_BACKUP_AGE_RECIPIENT:-}
      CASERO_BACKUP_TARGET: ${CASERO_BACKUP_TARGET:-}
      CASERO_BACKUP_HEARTBEAT_URL: ${CASERO_BACKUP_HEARTBEAT_URL:-}
      CASERO_DISK_HEARTBEAT_URL: ${CASERO_DISK_HEARTBEAT_URL:-}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${CASERO_BACKUP_B2_KEY_ID:-}
      RCLONE_CONFIG_B2_KEY: ${CASERO_BACKUP_B2_APP_KEY:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  edge:
    image: ${CASERO_EDGE_IMAGE:-ghcr.io/alesso2805/casero-edge}:${IMAGE_TAG:?}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CASERO_DOMAIN: ${CASERO_DOMAIN:?}
      CASERO_TLS: ${CASERO_TLS:?}
      CASERO_BUSINESS_NAME: ${CASERO_BUSINESS_NAME:?}
      CASERO_BUSINESS_RUC: ${CASERO_BUSINESS_RUC:?}
      CASERO_BUSINESS_ADDRESS: ${CASERO_BUSINESS_ADDRESS:?}
      CASERO_COMPLAINTS_INBOX: ${CASERO_COMPLAINTS_INBOX:?}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
