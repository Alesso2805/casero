name: casero

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: casero-backend:dev

x-mail: &mail
  CASERO_SMTP_HOST: mailpit
  CASERO_SMTP_PORT: "1025"
  CASERO_SMTP_SECURITY: none
  CASERO_MAIL_FROM: Casero <no-reply@casero.localhost>

x-business: &business
  CASERO_BUSINESS_NAME: "[nombre completo]"
  CASERO_BUSINESS_RUC: "[RUC]"
  CASERO_BUSINESS_ADDRESS: "[domicilio]"
  CASERO_COMPLAINTS_INBOX: reclamos@casero.localhost
  CASERO_PRIVACY_INBOX: privacidad@casero.localhost

services:
  postgres:
    image: postgres:17-trixie
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: casero
      CASERO_OWNER_PASSWORD: ${CASERO_OWNER_PASSWORD:-casero_owner_dev}
      CASERO_BACKUP_PASSWORD: ${CASERO_BACKUP_PASSWORD:-casero_backup_dev}
      CASERO_APP_PASSWORD: ${CASERO_APP_PASSWORD:-casero_app_dev}
      CASERO_WORKER_PASSWORD: ${CASERO_WORKER_PASSWORD:-casero_worker_dev}
      CASERO_ADMIN_PASSWORD: ${CASERO_ADMIN_PASSWORD:-casero_admin_dev}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname casero --host 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m casero.tax.infrastructure.tax_config"]
    environment:
      CASERO_MIGRATION_DATABASE_URL: postgresql+asyncpg://casero_owner:${CASERO_OWNER_PASSWORD:-casero_owner_dev}@postgres:5432/casero
      CASERO_ADMIN_DATABASE_URL: postgresql+asyncpg://casero_admin:${CASERO_ADMIN_PASSWORD:-casero_admin_dev}@postgres:5432/casero
      CASERO_PUBLIC_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "--factory", "casero.api:create_app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    environment:
      CASERO_APP_DATABASE_URL: postgresql+asyncpg://casero_app:${CASERO_APP_PASSWORD:-casero_app_dev}@postgres:5432/casero
      CASERO_RATE_LIMIT_KEY: ${CASERO_RATE_LIMIT_KEY:-rate-limit-key-for-local-development}
      CASERO_EMAIL_HASH_KEY: ${CASERO_EMAIL_HASH_KEY:-email-hash-key-for-local-development}
      CASERO_SES_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:casero-dev
      CASERO_UNSUBSCRIBE_KEY: ${CASERO_UNSUBSCRIBE_KEY:-unsubscribe-key-for-local-development}
      CASERO_ACCEPTANCE_IP_KEY: ${CASERO_ACCEPTANCE_IP_KEY:-acceptance-ip-key-for-local-development}
      # Development-only keys of zero and one bytes; production keys live in Bitwarden.
      CASERO_ENCRYPTION_KEYS: ${CASERO_ENCRYPTION_KEYS:-dev:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      CASERO_ENCRYPTION_ACTIVE_KEY: ${CASERO_ENCRYPTION_ACTIVE_KEY:-dev}
      CASERO_DOC_HMAC_KEY: ${CASERO_DOC_HMAC_KEY:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE}
      CASERO_TENANT_LINK_KEYS: ${CASERO_TENANT_LINK_KEYS:-dev:AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI}
      CASERO_TENANT_LINK_ACTIVE_KEY: ${CASERO_TENANT_LINK_ACTIVE_KEY:-dev}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      CASERO_PUBLIC_URL: http://localhost
      <<: *mail
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  worker:
    <<: *backend
    command: ["python", "-m", "casero.worker"]
    environment:
      CASERO_WORKER_DATABASE_URL: postgresql://casero_worker:${CASERO_WORKER_PASSWORD:-casero_worker_dev}@postgres:5432/casero
      CASERO_EMAIL_HASH_KEY: ${CASERO_EMAIL_HASH_KEY:-email-hash-key-for-local-development}
      <<: [*mail, *business]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  web:
    build: ./web
    volumes:
      - ./docs/legal:/home/node/docs/legal:ro

  caddy:
    image: caddy:2.11
    ports:
      - "${CASERO_HTTP_PORT:-80}:80"
      - "${CASERO_HTTPS_PORT:-443}:443"
    environment:
      <<: *business
      CASERO_LAN_HOST: ${CASERO_LAN_HOST:-lan.localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - web

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  caddy-data:
