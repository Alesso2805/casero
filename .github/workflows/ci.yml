name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.25"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: uv run python scripts/export_openapi.py ../web/src/api/openapi.json
        working-directory: backend
      - run: pnpm run generate:api
        working-directory: web
      - name: Generated API files match the backend
        run: git diff --exit-code -- web/src/api

  compose:
    name: Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up --detach --build
      - name: Wait for the API through Caddy
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost/api/health; then exit 0; fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs
          exit 1
      - name: Check the migrator, the web app and the admin block
        run: |
          test "$(docker compose ps --all --format '{{.Service}} {{.State}} {{.ExitCode}}' | grep '^migrate ')" = "migrate exited 0"
          curl --silent --fail http://localhost/ | grep --quiet "<title>Casero</title>"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/api/admin/x)" = "404"
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  edge:
    name: Edge
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ci
      CASERO_DOMAIN: localhost
      CASERO_TLS: internal
      CASERO_POSTGRES_INIT: ../postgres/init
      POSTGRES_PASSWORD: ci_postgres
      CASERO_OWNER_PASSWORD: ci_owner
      CASERO_BACKUP_PASSWORD: ci_backup
      CASERO_APP_PASSWORD: ci_app
      CASERO_WORKER_PASSWORD: ci_worker
      CASERO_ADMIN_PASSWORD: ci_admin
      CASERO_RATE_LIMIT_KEY: ci_rate_limit
      CASERO_EMAIL_HASH_KEY: ci_email_hash
      CASERO_SES_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:casero-ci
      CASERO_UNSUBSCRIBE_KEY: ci_unsubscribe
      CASERO_ACCEPTANCE_IP_KEY: ci_acceptance_ip
      CASERO_SMTP_HOST: smtp.invalid
      CASERO_SMTP_USERNAME: ci_smtp
      CASERO_SMTP_PASSWORD: ci_smtp
      CASERO_MAIL_FROM: Casero <no-reply@example.com>
      CASERO_BUSINESS_NAME: Negocio de Prueba
      CASERO_BUSINESS_RUC: "10000000001"
      CASERO_BUSINESS_ADDRESS: Av. Ficticia 100, Lima
      CASERO_COMPLAINTS_INBOX: reclamos@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production images
        run: |
          docker build --file backend/Dockerfile --tag ghcr.io/alesso2805/casero-backend:ci .
          docker build --file infra/edge/Dockerfile --tag ghcr.io/alesso2805/casero-edge:ci .
      - name: Start the production stack
        run: docker compose --project-name casero-edge --file infra/deploy/docker-compose.yml up --detach
      - name: Wait for the edge
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --insecure --fail https://localhost/api/health; then exit 0; fi
            sleep 2
          done
          docker compose --project-name casero-edge --file infra/deploy/docker-compose.yml logs
          exit 1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check headers, caching and routing
        working-directory: backend
        env:
          CASERO_EDGE_URL: https://localhost
        run: |
          uv sync --locked
          uv run pytest tests/deployment
      - name: Check that edge errors leave no request data in the logs
        run: |
          compose="docker compose --project-name casero-edge --file infra/deploy/docker-compose.yml"
          $compose stop api
          status=$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --header 'X-Tenant-Token: ci-edge-log-probe' 'https://localhost/api/tenant/probe?q=ci-edge-log-probe')
          test "$status" = 502
          if $compose logs edge | grep --extended-regexp 'ci-edge-log-probe|remote_ip|client_ip'; then
            echo "The edge logged request data from a failed request"
            exit 1
          fi
      - name: Stop the stack
        if: always()
        run: docker compose --project-name casero-edge --file infra/deploy/docker-compose.yml down --volumes

  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          uv export --locked --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx "pip-audit==$PIP_AUDIT_VERSION" --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Audit JavaScript dependencies
        working-directory: web
        run: pnpm audit --audit-level high
      - name: Scan the history for secrets
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
