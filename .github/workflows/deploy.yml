name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/alesso2805/casero-backend
  EDGE_IMAGE: ghcr.io/alesso2805/casero-edge
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  images:
    name: Images
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/edge/Dockerfile
          push: true
          tags: ${{ env.EDGE_IMAGE }}:${{ env.IMAGE_TAG }}

  server:
    name: Server
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure SSH with the pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack definition
        run: |
          scp -i ~/.ssh/id_deploy infra/deploy/docker-compose.yml "$TARGET:/opt/casero/docker-compose.yml"
          ssh -i ~/.ssh/id_deploy "$TARGET" "mkdir -p /opt/casero/postgres-init"
          scp -i ~/.ssh/id_deploy -r infra/postgres/init/. "$TARGET:/opt/casero/postgres-init/"
      - name: Pull and start the new images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/id_deploy "$TARGET" "cd /opt/casero \
            && printf 'IMAGE_TAG=%s\n' '$IMAGE_TAG' > image.env \
            && docker compose --env-file .env --env-file image.env pull \
            && docker compose --env-file .env --env-file image.env up --detach --remove-orphans \
            && docker logout ghcr.io"
      - name: Check the public health endpoint
        env:
          CASERO_DOMAIN: ${{ vars.CASERO_DOMAIN }}
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors \
            "https://$CASERO_DOMAIN/api/health"
